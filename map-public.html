const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(code){
 const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(payload.salt),iterations:payload.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
 const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(payload.iv)},key,bytes(payload.ciphertext));
 const html=new TextDecoder().decode(clear);document.open();document.write(html);document.close();
}
const saved=sessionStorage.getItem('workbench_code');
if(saved){unlock(saved).catch(()=>{sessionStorage.removeItem('workbench_code');});}
document.getElementById('unlock').addEventListener('submit',async event=>{event.preventDefault();const button=document.getElementById('submit'),error=document.getElementById('error'),code=document.getElementById('code').value.trim();button.disabled=true;error.textContent='正在打开…';try{sessionStorage.setItem('workbench_code',code);await unlock(code);}catch(e){sessionStorage.removeItem('workbench_code');error.textContent='访问码不正确，请重新输入。';button.disabled=false;}});
