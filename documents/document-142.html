<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>基金资料 · Growhill Wealth</title><style>*{box-sizing:border-box}body{margin:0;background:#f2ece0;color:#33271e;font:16px/1.5 Arial,"Microsoft YaHei",sans-serif}main{max-width:520px;margin:8vh auto;padding:24px;background:#fff;border:1px solid #d2c7b8;border-radius:8px}input,button,a{font:inherit}input,button{width:100%;padding:11px;margin-top:8px}button{background:#2b1c10;color:#fff;border:0;border-radius:4px}#error{color:#9a5537;min-height:24px}#viewer{display:none;width:100%;height:85vh;border:0}#download{display:none}</style></head><body><main id="gate"><h1>基金资料 PDF</h1><p>获批准的香港专业投资者资料，请输入对外工作台访问码。</p><form id="unlock"><label for="code">访问码</label><input id="code" type="password" autocomplete="off" required><button>打开 PDF</button><p id="error" role="alert"></p></form></main><iframe id="viewer" title="基金资料 PDF"></iframe><p style="text-align:center"><a id="download" download="fund-document.pdf">下载 PDF</a></p><script>
const payload={"salt":"zpjEcSiLZzhLYMBnpK7EEA==","iv":"oJgsLU5ft0zYPZg+","iterations":600000,"ciphertextUrl":"document-142.enc?v=434b05437272ceb0"};
const storageKey="growhill-workbench-code-external";
const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function openPdf(code){const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(payload.salt),iterations:payload.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);const response=await fetch(payload.ciphertextUrl,{cache:'force-cache'});if(!response.ok)throw Error('asset');const encrypted=new Uint8Array(await response.arrayBuffer());const pdf=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(payload.iv)},key,encrypted);const blobUrl=URL.createObjectURL(new Blob([pdf],{type:'application/pdf'}));document.getElementById('gate').style.display='none';document.getElementById('viewer').style.display='block';document.getElementById('viewer').src=blobUrl;const link=document.getElementById('download');link.href=blobUrl;link.style.display='inline-block';try{sessionStorage.setItem(storageKey,code)}catch(_){}}
async function attempt(code){try{await openPdf(code)}catch(_){try{sessionStorage.removeItem(storageKey)}catch(_){}document.getElementById('error').textContent='访问码不正确，请重新输入。';}}
document.getElementById('unlock').addEventListener('submit',event=>{event.preventDefault();attempt(document.getElementById('code').value.trim())});
try{const saved=sessionStorage.getItem(storageKey);if(saved)attempt(saved)}catch(_){}
</script></body></html>
